<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rudra-Go</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.6;
        }
        nav {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
        }
        nav a {
            margin-right: 1rem;
            text-decoration: none;
            color: #007bff;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .flash {
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 4px;
        }
        .flash-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .flash-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        h1 {
            margin-bottom: 1rem;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        ul li {
            padding: 0.5rem 0;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Главная</a>
        <a href="/todo/">Задачи</a>
        {{if .IsAuth}}
            <a href="/auth/logout">Выйти</a>
        {{else}}
            <a href="/auth/login">Войти</a>
            <a href="/auth/register">Регистрация</a>
        {{end}}
    </nav>

    {{template "content" .}}
</body>
</html>
